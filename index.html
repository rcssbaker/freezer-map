<!DOCTYPE html>
<html>
<head>
  <title>Freezer Pallet Map</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Freezer Pallet Map</h1>

<div class="controls">
<input id="searchInput" type="text" placeholder="Search pallet ID" disabled>
  <button id="searchBtn">Search</button>

  <select id="colorPicker">
    <option value="none">No Color</option>
    <option value="red">Red</option>
    <option value="darkorange">Orange</option>
    <option value="green">Green</option>
    <option value="blue">Blue</option>
  </select>

  <button id="resetBtn">Reset</button>
  <button id="exportBtn">Export</button>
  <input type="file" id="importFile" accept=".json">
</div>

<div id="keypad" class="keypad hidden">
  <div id="keypad-display"></div>

  <div class="keypad-row">
    <button class="key">1</button>
    <button class="key">2</button>
    <button class="key">3</button>
  </div>

  <div class="keypad-row">
    <button class="key">4</button>
    <button class="key">5</button>
    <button class="key">6</button>
  </div>

  <div class="keypad-row">
    <button id="keypad-back" class="action">⌫</button>
    <button class="key">0</button>
    <button id="keypad-cancel" class="action">X</button>
  </div>

  <div class="keypad-row keypad-ok-row">
    <button id="keypad-ok" class="action ok-wide">OK</button>
  </div>
</div>


<div id="grid"></div>

<script src="app.js"></script>
</body>
</html>
